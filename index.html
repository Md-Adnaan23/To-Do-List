<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daily Routine</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="editor">

    <!-- Titlebar -->
    <div class="titlebar">
      <div class="dots" aria-hidden="true">
        <span class="dot dot-red"></span>
        <span class="dot dot-amber"></span>
        <span class="dot dot-green"></span>
      </div>

      <span class="tab">daily-routine.js</span>
    </div>

    <!-- Prompt / input row -->
    <div class="input-row">
      <span class="prompt" aria-hidden="true">&gt;</span>

      <input
        type="text"
        id="myInput"
        class="task-input"
        placeholder="Add a task and press Enter..."
        aria-label="New task"
        autocomplete="off"
      >

      <button type="button" id="addBtn" class="add-btn">
        Add <span class="key">&#9166;</span>
      </button>
    </div>

    <!-- Task list -->
    <ul id="myUL" class="code-lines">

      <li>
        <span
          class="mark"
          role="checkbox"
          aria-checked="false"
          tabindex="0"
        ></span>

        <span class="task-text">Read Quran</span>
      </li>

      <li class="checked">
        <span
          class="mark"
          role="checkbox"
          aria-checked="true"
          tabindex="0"
        ></span>

        <span class="task-text">Coding</span>
      </li>

      <li>
        <span
          class="mark"
          role="checkbox"
          aria-checked="false"
          tabindex="0"
        ></span>

        <span class="task-text">Read PDFs</span>
      </li>

      <li>
        <span
          class="mark"
          role="checkbox"
          aria-checked="false"
          tabindex="0"
        ></span>

        <span class="task-text">Breakfast</span>
      </li>

      <li>
        <span
          class="mark"
          role="checkbox"
          aria-checked="false"
          tabindex="0"
        ></span>

        <span class="task-text">Learn</span>
      </li>

      <li>
        <span
          class="mark"
          role="checkbox"
          aria-checked="false"
          tabindex="0"
        ></span>

        <span class="task-text">Take nap</span>
      </li>

      <li>
        <span
          class="mark"
          role="checkbox"
          aria-checked="false"
          tabindex="0"
        ></span>

        <span class="task-text">Web Dev</span>
      </li>

      <li>
        <span
          class="mark"
          role="checkbox"
          aria-checked="false"
          tabindex="0"
        ></span>

        <span class="task-text">lunch</span>
      </li>

    </ul>

    <!-- Status bar -->
    <div class="statusbar">
      <span id="statusCount">8 tasks · 1 done</span>
      <span class="statusbar-right">JavaScript · UTF-8</span>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
